<svg id="scene" class="resting" viewBox="0 0 430 860" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Karlı geniş bir düzlükte bir penguen arkadan görünüyor, uzaktaki dağlara doğru yürüyor">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--sky-top)"/>
      <stop offset="0.55" style="stop-color:var(--sky-mid)"/>
      <stop offset="1" style="stop-color:var(--sky-low)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color:var(--glow);stop-opacity:0.8"/>
      <stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--field-far)"/>
      <stop offset="1" style="stop-color:var(--field-near)"/>
    </linearGradient>
    <linearGradient id="hazeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--haze);stop-opacity:0"/>
      <stop offset="1" style="stop-color:var(--haze);stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="fogg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--haze);stop-opacity:0"/>
      <stop offset="0.45" style="stop-color:var(--haze);stop-opacity:1"/>
      <stop offset="1" style="stop-color:var(--haze);stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--pg2)"/>
      <stop offset="0.5" style="stop-color:var(--pg)"/>
      <stop offset="1" style="stop-color:var(--pg)"/>
    </linearGradient>
    <radialGradient id="wispg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color:var(--flake);stop-opacity:0.42"/>
      <stop offset="1" style="stop-color:var(--flake);stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" style="stop-color:#000;stop-opacity:0"/>
      <stop offset="1" style="stop-color:#000;stop-opacity:0.2"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="sutun" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="0" width="430" height="860"/>
    </clipPath>
    <clipPath id="yanlar" clipPathUnits="userSpaceOnUse">
      <rect x="-5000" y="0" width="5000" height="860"/>
      <rect x="430" y="0" width="5000" height="860"/>
    </clipPath>
  </defs>

  <rect x="-3000" width="6430" height="490" fill="url(#sky)"/>
  <g class="stars" id="stars" fill="#fff"></g>
  <g class="stars wide-only" id="stars-wide" fill="#fff"></g>
  <circle cx="336" cy="352" r="190" fill="url(#glow)"/>
  <circle cx="336" cy="352" r="19" fill="var(--sun)"/>

  <!-- Dağlar kendi 430 birimlik sütununa kırpılır: kenardan taşan parçalar aynalanan kopyada havada kalmasın. -->
  <g id="daglar" clip-path="url(#sutun)">
    <path d="M0 470 L0 436 L38 418 L72 440 L118 404 L160 436 L206 386 L236 414 L270 366 L312 410 L352 384 L392 420 L430 400 L430 470 Z" fill="var(--m1)"/>
    <path d="M0 470 L0 452 L46 418 L88 446 L132 404 L176 440 L236 330 L262 372 L292 348 L338 408 L384 386 L430 424 L430 470 Z" fill="var(--m2)"/>
    <path d="M-10 470 L-10 446 L60 410 L104 438 L150 392 L196 420 L236 300 L270 350 L292 330 L336 392 L380 372 L440 420 L440 470 Z" fill="var(--m3)"/>
    <polygon points="236,300 270,350 292,330 336,392 322,420 300,430 262,470 246,470 252,400 240,350" fill="var(--m3lit)"/>
    <polygon points="150,392 196,420 172,470 150,470 156,430" fill="var(--m3lit)"/>
    <polygon points="380,372 440,420 440,470 392,470 396,420" fill="var(--m3lit)"/>
    <polygon points="236,300 270,350 258,344 252,358 242,342 232,352 222,338 214,342" fill="var(--snow)"/>
    <polygon points="236,300 270,350 258,344 252,358 242,342" fill="var(--snow-lit)"/>
    <polygon points="292,330 308,352 298,348 292,358 284,346 278,350" fill="var(--snow)"/>
    <polygon points="292,330 308,352 298,348 292,358" fill="var(--snow-lit)"/>
  </g>
  <!-- Geniş pencerede dağlar yanlara aynalanarak uzar (860 birim dönemli). Kırpma, 0..430 sütununu hiç etkilemez. -->
  <g class="wide-only" clip-path="url(#yanlar)">
    <use href="#daglar" transform="translate(-860 0)"/>
    <use href="#daglar" transform="scale(-1 1)"/>
    <use href="#daglar" transform="translate(860 0) scale(-1 1)"/>
    <use href="#daglar" transform="translate(860 0)"/>
  </g>
  <!-- Aynalanan dikişte (x=±430) uzak sıranın tepesi öndeki aydınlık sırtın V'sinden görünmesin diye sırt kapatılır. -->
  <g class="wide-only" fill="var(--m3lit)">
    <polygon points="419,405.8 430,399.4 441,405.8 430,413.5"/>
    <polygon points="-441,405.8 -430,399.4 -419,405.8 -430,413.5"/>
  </g>
  <rect x="-3000" y="410" width="6430" height="62" fill="url(#hazeg)"/>

  <rect x="-3000" y="468" width="6430" height="392" fill="url(#field)"/>
  <rect id="fog" x="-3000" y="250" width="6430" height="310" fill="url(#fogg)" style="opacity:0.72"/>
  <g id="ripples" fill="none" stroke-linecap="round"></g>
  <g id="ripples-wide" class="wide-only" fill="none" stroke-linecap="round"></g>
  <g id="wisps">
    <ellipse class="wisp" cx="520" cy="500" rx="170" ry="9" fill="url(#wispg)" style="animation-duration:46s;animation-delay:-18s"/>
    <ellipse class="wisp" cx="640" cy="560" rx="210" ry="14" fill="url(#wispg)" style="animation-duration:38s;animation-delay:-6s"/>
    <ellipse class="wisp" cx="560" cy="700" rx="260" ry="22" fill="url(#wispg)" style="animation-duration:30s;animation-delay:-22s"/>
  </g>

  <g id="prints" fill="var(--print)"></g>

  <g id="pengpos" style="transform: translate(205px, 690px) scale(1.35)">
    <g id="peng">
      <ellipse cx="-26" cy="4" rx="50" ry="7" fill="#000" fill-opacity="0.16"/>
      <g class="foot fl"><ellipse cx="-11" cy="-2" rx="9" ry="4.2" fill="var(--foot)"/></g>
      <g class="foot fr"><ellipse cx="11" cy="-2" rx="9" ry="4.2" fill="var(--foot)"/></g>
      <g class="waddle">
        <ellipse cx="0" cy="-42" rx="26" ry="40" fill="url(#back)"/>
        <path d="M -25.2 -34 A 26 40 0 0 0 -14 -9 Q -27 -22 -25.2 -34 Z" fill="var(--belly)" fill-opacity="0.85"/>
        <path d="M 25.2 -34 A 26 40 0 0 1 14 -9 Q 27 -22 25.2 -34 Z" fill="var(--belly)" fill-opacity="0.85"/>
        <g class="flip-l">
          <path d="M -22 -70 C -36 -60 -42 -40 -37 -20 C -31 -34 -26 -52 -19 -64 Z" fill="var(--pg)" stroke="var(--pg2)" stroke-width="0.8"/>
        </g>
        <g class="flip-r">
          <path d="M 22 -70 C 36 -60 42 -40 37 -20 C 31 -34 26 -52 19 -64 Z" fill="var(--pg)" stroke="var(--pg2)" stroke-width="0.8"/>
        </g>
        <path d="M -7 -10 L 0 5 L 7 -10 Z" fill="var(--pg)"/>
        <path d="M 13 -76.6 A 26 40 0 0 1 24.4 -28.3 Q 29 -52 13 -76.6 Z" fill="var(--rim)" fill-opacity="0.7"/>
        <g class="head">
          <circle cx="0" cy="-88" r="15" fill="var(--pg)"/>
          <ellipse cx="-2" cy="-96" rx="8" ry="5" fill="var(--pg2)" fill-opacity="0.6"/>
          <ellipse cx="-14" cy="-86" rx="2.6" ry="6" fill="var(--patch)" fill-opacity="0.6"/>
          <ellipse cx="14" cy="-86" rx="2.6" ry="6" fill="var(--patch)" fill-opacity="0.6"/>
          <path d="M 8 -101 A 15 15 0 0 1 15 -88 Q 12 -97 8 -101 Z" fill="var(--rim)" fill-opacity="0.7"/>
        </g>
      </g>
    </g>
  </g>

  <g id="flakes"></g>
  <g id="flakes-wide" class="wide-only"></g>
  <rect class="narrow-only" width="430" height="860" fill="url(#vig)"/>
  <rect id="vig-genis" class="wide-only" width="430" height="860" fill="url(#vig)"/>
  <rect class="narrow-only" width="430" height="860" filter="url(#grain)" opacity="0.07"/>
  <rect id="grain-genis" class="wide-only" width="430" height="860" filter="url(#grain)" opacity="0.07"/>
</svg>
